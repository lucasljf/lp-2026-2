services:
  db:
    image: mysql:8.0 # Ou 'latest'
    container_name: mysql_container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123
#      MYSQL_DATABASE: banco
#      MYSQL_USER: paulo
#      MYSQL_PASSWORD: 123
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
